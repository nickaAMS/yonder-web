<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FAQ | Yonder</title>
  <meta name="description" content="Answers to common questions about Yonder — personalised bedtime audio stories, story safety, listening devices, accounts and data.">
  <link rel="canonical" href="https://yonder-web.vercel.app/faq.html">
  <meta property="og:title" content="FAQ | Yonder">
  <meta property="og:description" content="Answers to common questions about Yonder — personalised bedtime audio stories, story safety, listening devices, accounts and data.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yonder-web.vercel.app/faq.html">
  <meta property="og:image" content="https://yonder-web.vercel.app/public/illustrations/family-bedtime.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FAQ | Yonder">
  <meta name="twitter:description" content="Answers to common questions about Yonder — personalised bedtime audio stories, story safety, listening devices, accounts and data.">
  <meta name="twitter:image" content="https://yonder-web.vercel.app/public/illustrations/family-bedtime.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:oklch(16% .035 275);--night:oklch(21% .045 275);--paper:oklch(95% .025 77);--cream:oklch(88% .04 72);--honey:oklch(76% .13 72);--rose:oklch(59% .09 25);--mist:oklch(82% .018 72);--line:oklch(90% .03 75/.18);--serif:"Cormorant Garamond",Georgia,serif;--sans:"Plus Jakarta Sans",Arial,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:16px;line-height:1.6}a{color:inherit}button,a{font:inherit}
    .skip{position:absolute;left:-999px}.skip:focus{left:1rem;top:1rem;z-index:9;background:var(--paper);color:var(--ink);padding:.7rem 1rem;border-radius:.5rem}
    .nav{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.25rem clamp(1.25rem,4vw,4rem);border-bottom:1px solid var(--line)}
    .wordmark{font:600 2rem/1 var(--serif);text-decoration:none;letter-spacing:-.04em;color:var(--paper)}
    .nav-links{display:flex;align-items:center;gap:1.25rem}
    .nav-link{color:var(--mist);text-decoration:none;font-weight:600;font-size:.85rem}
    .nav-link:hover,.nav-link.is-active{color:var(--paper);text-decoration:underline}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--honey);border-radius:999px;padding:.65rem 1.1rem;text-decoration:none;font-weight:700;font-size:.82rem;color:var(--honey);background:transparent;transition:transform .2s var(--ease),background .2s,box-shadow .2s}
    .button:hover{transform:translateY(-2px);background:var(--paper);color:var(--ink);box-shadow:0 12px 26px oklch(10% .02 275/.22)}
    .eyebrow{color:var(--honey);font-weight:700;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 1.25rem}
    .page-head{max-width:720px;margin:0 auto;padding:clamp(3.5rem,9vw,6rem) clamp(1.25rem,6vw,2rem) clamp(2.5rem,6vw,3.5rem)}
    .page-head h1{font:600 clamp(2.6rem,6vw,4rem)/1 var(--serif);letter-spacing:-.03em;margin:0}
    .page-head p{color:var(--mist);max-width:52ch;margin:1.2rem 0 0;font-size:1.02rem}
    main{max-width:720px;margin:0 auto;padding:0 clamp(1.25rem,6vw,2rem) clamp(4rem,9vw,6rem)}
    .faq-section{margin:0 0 clamp(2.5rem,6vw,3.5rem)}
    .faq-section h2{font:600 clamp(1.6rem,3.6vw,2rem)/1.15 var(--serif);letter-spacing:-.02em;margin:0 0 .25rem;color:var(--cream)}
    .faq-list{list-style:none;margin:.75rem 0 0;padding:0}
    .faq-item{border-top:1px solid var(--line)}
    .faq-item:last-child{border-bottom:1px solid var(--line)}
    .faq-item summary{cursor:pointer;list-style:none;padding:1.25rem 1.75rem 1.25rem 0;position:relative;font:600 1.08rem/1.4 var(--serif);color:var(--paper)}
    .faq-item summary::-webkit-details-marker{display:none}
    .faq-item summary::after{content:"+";position:absolute;right:0;top:1.2rem;color:var(--honey);font:600 1.3rem/1 var(--sans);transition:transform .2s var(--ease)}
    .faq-item[open] summary::after{content:"\2212"}
    .faq-item summary:hover{color:var(--honey)}
    .faq-item summary:focus-visible{outline:2px solid var(--honey);outline-offset:4px}
    .faq-answer{margin:0 0 1.4rem;color:var(--mist);font-size:.98rem;line-height:1.68;max-width:62ch}
    .faq-answer p{margin:0 0 1rem}
    .faq-answer p:last-child{margin-bottom:0}
    .faq-fallback{color:var(--mist);font-size:.95rem}
    .footer{padding:1.5rem clamp(1.25rem,4vw,4rem);display:flex;justify-content:space-between;gap:1rem;color:var(--mist);font-size:.72rem;background:var(--night)}
    .footer a{text-decoration:none;color:inherit}
    .footer a:hover{text-decoration:underline}
    @media(max-width:600px){.nav{flex-wrap:wrap}.footer{flex-direction:column;gap:.4rem}}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <nav class="nav" aria-label="Main navigation">
    <a class="wordmark" href="index.html">yonder</a>
    <div class="nav-links">
      <a class="nav-link" href="blog.html">Blog</a>
      <a class="nav-link is-active" href="faq.html">FAQ</a>
      <a class="button" href="index.html#preview">Request preview access</a>
    </div>
  </nav>
  <div class="page-head">
    <p class="eyebrow">Questions, answered</p>
    <h1>Frequently asked questions</h1>
    <p>Everything parents ask us before their first story, and a few things they ask after.</p>
  </div>
  <main id="main">
    <div id="faq-root">
      <p class="faq-fallback">Loading the FAQ&hellip;</p>
    </div>
  </main>
  <footer class="footer"><span>&copy; 2026 Yonder &middot; Amsterdam</span><span><a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></span></footer>
  <script>
    function escapeText(str) {
      const span = document.createElement('span');
      span.textContent = str;
      return span;
    }

    async function renderFaq() {
      const root = document.getElementById('faq-root');
      let data;
      try {
        const response = await fetch('faq.json');
        if (!response.ok) throw new Error('Bad response');
        data = await response.json();
        if (!data || !Array.isArray(data.sections)) throw new Error('Bad shape');
      } catch (error) {
        root.innerHTML = '';
        const fallback = document.createElement('p');
        fallback.className = 'faq-fallback';
        fallback.textContent = 'We could not load the FAQ right now. Please try again shortly.';
        root.appendChild(fallback);
        return;
      }

      root.innerHTML = '';
      data.sections.forEach(section => {
        const sectionEl = document.createElement('section');
        sectionEl.className = 'faq-section';

        const heading = document.createElement('h2');
        heading.appendChild(escapeText(section.title || ''));
        sectionEl.appendChild(heading);

        const list = document.createElement('ul');
        list.className = 'faq-list';

        (section.questions || []).forEach(item => {
          const li = document.createElement('li');
          li.className = 'faq-item';

          const details = document.createElement('details');
          const summary = document.createElement('summary');
          summary.appendChild(escapeText(item.q || ''));
          details.appendChild(summary);

          const answer = document.createElement('div');
          answer.className = 'faq-answer';
          (item.a || []).forEach(paragraph => {
            const p = document.createElement('p');
            p.appendChild(escapeText(paragraph));
            answer.appendChild(p);
          });
          details.appendChild(answer);

          li.appendChild(details);
          list.appendChild(li);
        });

        sectionEl.appendChild(list);
        root.appendChild(sectionEl);
      });
    }

    renderFaq();
  </script>
</body>
</html>
